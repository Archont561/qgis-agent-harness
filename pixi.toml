[workspace]
name = "research"
channels = ["conda-forge"]
platforms = ["linux-64"]

# ─────────────────────────────────────────────────────────── features ──

# One dependency per feature; environments pick features — no workspace-level [dependencies].

[feature.py.dependencies]
# Declared once and included by every Python env, so `test` and `experiment` cannot drift apart.
python = "3.12.*"

[feature.geo.dependencies]
qgis = "3.44.*"          # LTR used in the thesis (conda-forge also ships 4.x)
geopandas = "==1.2.0"
scipy = "==1.18.1"
matplotlib = "==3.11.2"
pingouin = ">=0.7.0,<0.8"

[feature.test.pypi-dependencies]
# `cov-upload` is a task of this feature, so its binary lives here too (pypi: not on conda-forge).
codecov-cli = "==11.3.2"

[feature.test.dependencies]
# pinned <9: pytest-bdd 8.1.0 still reads FixtureManager._arg2fixturedefs, removed in pytest 9
pytest = "8.*"
pytest-bdd = "==8.1.0"
hypothesis = "==6.170.15"
pytest-cov = "7.*"       # coverage.xml for Codecov; config in experiment/pyproject.toml

[feature.qa.dependencies]
actionlint = "==1.7.12"
shellcheck = "==0.11.0"
lefthook = "==2.2.2"
ruff = "==0.17.4"
convco = "0.7.*"         # conventional-commit lint + changelog; config in .versionrc
# Prose linting is linting: vale sits beside ruff here, so the hook and `pixi run qa` stay in one env.
vale = ">=3.26.0,<4"     # prose linter; config in .vale.ini, rules documented in docs/prose.md
# For .alint.yml, not for us: its `thesis-frontmatter` rule shells out to `python3 -c "import yaml"`.
pyyaml = "==6.0.3"

[feature.qa.pypi-dependencies]
alint = "==0.21.2"              # not on conda-forge — pypi only
gherlint = ">=0.5.0, <0.6"

[feature.harness.dependencies]
# Cards are YAML (experiment/tasks/README.md); the loader parses them, so the parser is a real dependency.
pyyaml = "==6.0.3"

[feature.harness.pypi-dependencies]
# The harness as a library, not a concern: `test` imports it and the `harness` task runs it, so both envs have it.
typer = ">=0.12, <1"      # the harness CLI (experiment/src/__main__.py, package `qgis_agent_harness`)
# A wheel, not editable: setuptools cannot map this flat src/ layout — re-run `pixi install` after editing it.
qgis-agent-harness = { path = "experiment" }

[feature.js.dependencies]
bun = "1.4.*"
# No nodejs: `--bun` makes bun intercept the `#!/usr/bin/env node` shebang (see the `bun` task).

[feature.renderers.dependencies]
# Separate feature and env: manim brings numpy>=2.1, scipy>=1.13 and ffmpeg, which must not reach the QGIS solve.
manim = "0.22.*"          # community edition; ffmpeg arrives with it, LaTeX only for MathTex
typst = "0.15.*"          # the compiler binary; conda-forge, not the pypi bindings
pandoc = "3.*"            # the converter: LaTeX -> typst maths, and LaTeX -> DOCX/OMML for the equation

[feature.renderers.pypi-dependencies]
easypptx = ">=0.11, <1"   # not on conda-forge — pypi only (ships as EasyPPTX)
pypdfium2 = "==5.15.1"           # rasterise the formula PDF inside the env (no poppler needed)
# The pandoc-free OMML backend (the `mathml-omml` command in the archont561-render skill).
latex2mathml = ">=3.81.1, <4"
mathml2omml = ">=0.0.2, <0.0.3"

# ────────────────────────────────────────────────────── environments ──

[environments]
# pixi always has a `default`; it is empty on purpose, so a bare `pixi run <cmd>` resolves to the one owner.
default = { features = [], no-default-feature = true }
experiment = { features = ["py", "geo", "harness", "experiment"], solve-group = "measurement" }
# Same solve group as `experiment`: the same harness wheel tests and runs, or a green test proves nothing.
test = { features = ["py", "harness", "test"], solve-group = "measurement" }
# Every linter, formatter and hook in one env: ruff, actionlint, shellcheck, alint, gherlint, convco, lefthook, vale.
qa = { features = ["py", "qa"], solve-group = "toolchain" }
js = { features = ["js"], no-default-feature = true, solve-group = "toolchain" }
# Its own solve group, so `pixi lock` can move numpy here without touching the QGIS solve.
renderers = { features = ["py", "renderers"], no-default-feature = true, solve-group = "renderers" }

# ───────────────────────────────────────────────────────────── tasks ──

# Tasks live in the feature that owns their binary, so each command belongs to one env and needs no `-e`.

[feature.js.tasks]
# Bound to the js env; `--bun` runs any `#!/usr/bin/env node` shebang itself, so the env needs no nodejs.
bun = { cmd = "bun --bun", description = "bun (bun runtime for node shebangs); trailing args forwarded" }
install = { cmd = "bun install", description = "install package.json deps" }
skills = { cmd = "bun x --bun skills", depends-on = ["install"], description = "skills CLI on bun's runtime" }
backlog = { cmd = "bun x --bun backlog", depends-on = ["install"], description = "backlog CLI against ./backlog" }
readme = { cmd = "bash scripts/readme.sh", description = "render README.md from .readme/README.md.ejs" }
readme-check = { cmd = "bash scripts/readme.sh --check", description = "fail when README.md is not the render of the template" }

[feature.test.tasks]
# Behavioural: each checker in scripts/ is run as alint runs it, against a throwaway tree.
test-scripts = { cmd = "pytest scripts/tests", description = "behavioural tests for the alint checkers in scripts/" }
# The sweep host is not a checker: .cluster/ is proved the same behavioural way, plus Gherkin.
test-cluster = { cmd = "pytest .cluster/tests", description = "behavioural and BDD tests for the sweep-host tooling in .cluster/" }
# --cov reads source/paths from experiment/pyproject.toml; the XML is what Codecov ingests.
test = { cmd = "pytest experiment --cov=experiment/src --cov-report=term-missing --cov-report=xml:coverage.xml", depends-on = ["test-scripts", "test-cluster"], description = "all three suites + coverage (pytest-bdd, hypothesis)" }
cov-upload = { cmd = "codecovcli upload-process --disable-search --fail-on-error -f coverage.xml", description = "upload coverage.xml to Codecov (CI only)" }

[feature.experiment.tasks]
# Commands only: this feature must sit in exactly one env, which is why the package lives in `harness`.
harness = { cmd = "python -m qgis_agent_harness", description = "thesis harness CLI; trailing args forwarded — bound to the experiment env" }
# It names its env: `pixi reinstall` builds a wheel for one, and implicit is how you get the wrong one.
sync = { cmd = "pixi reinstall -e experiment qgis-agent-harness", description = "rebuild the harness wheel in the experiment env after editing src/" }

[feature.qa.tasks]
lint = { cmd = "actionlint", description = "lint .github/workflows" }
shell = { cmd = "shellcheck", description = "shell script linter — pass files as args" }
hooks = { cmd = "lefthook install", description = "install git hooks (no-op without a git repo)" }
convco-check-message = { args = ["message_file"], cmd = "convco check --from-stdin --strip < '{{ message_file }}'", description = "lint one commit message file (lefthook commit-msg hook)" }
check-commits = { cmd = "convco check", description = "lint the commit range since the last tag" }
changelog = { cmd = "convco changelog", description = "print the unreleased changelog from conventional commits" }
alint = { cmd = "alint", description = "repo-structure linter (.alint.yml)" }
# gherlint exits 0 even on findings, so the awk below fails on any line ending in "(rule)" — except R202.
gherlint = { cmd = "gherlint lint experiment/features | awk '/\\)$/ && !/\\(consider-using-background\\)$/ {print; bad=1} END {exit bad+0}' && gherlint lint .cluster/features | awk '/\\)$/ && !/\\(consider-using-background\\)$/ {print; bad=1} END {exit bad+0}'", description = "Gherkin lint on experiment/features and .cluster/features; non-zero exit on any finding not accepted on purpose" }
gherlint-stats = { cmd = "gherlint stats experiment/features", description = "Gherkin metrics (scenarios, steps, background, tags) as a table" }
# pixi-sandbox is a GLOBAL CLI, not an env dependency; --script-path must be passed or `init` moves the launcher.
sandbox-init = { cmd = "pixi-sandbox init --script-path scripts/restore.sh", description = "regenerate the pixi-sandbox owned files (launcher in scripts/)" }
sandbox-check = { cmd = "pixi-sandbox init --check --script-path scripts/restore.sh", description = "verify the generated sandbox files match a fresh render" }
sandbox-plan = { cmd = "pixi-sandbox plan --config pixi-sandbox.toml", description = "validate the bundle plan and print the publish matrix" }
# vale is in this chain because it lives in this env: the aggregate never leaves its own environment.
qa = { cmd = "alint && ruff check . && ruff check .agents/skills/archont561-render && pixi run gherlint && pixi run prose", description = "every linter of the qa env: structure + python (incl. our skill) + gherkin + prose" }
ruff = { cmd = "ruff", description = "ruff passthrough (e.g. `pixi run ruff check .`)" }
lint-py = { cmd = "ruff check .", description = "python lint" }
fmt = { cmd = "ruff format .", description = "python format" }

# Vale lints prose, not code: the rule set and the paths that are not ours are in .vale.ini (docs/prose.md).
prose = { cmd = "vale thesis docs README.md AGENTS.md experiment", description = "prose lint (Vale) over the thesis and docs trees; zero errors means the gate passes" }
prose-sync = { cmd = "vale sync", description = "re-download the style package in .vale.ini over .vale/styles; review and commit the diff" }
vale = { cmd = "vale", description = "vale passthrough (e.g. `pixi run vale docs/`, `… vale --output=JSON thesis/`)" }

[feature.renderers.tasks]
# passthroughs, bound to the renderers env: `pixi run manim render scene.py Scene`, `… typst compile file.typ`
manim = { cmd = "manim", description = "manim passthrough (render animations for the results chapter)" }
typst = { cmd = "typst", description = "typst passthrough (e.g. `typst compile file.typ`)" }
# Maths is dispatched by the archont561 runtime, which finds the `commands/*.py` of its render skill.
render = { cmd = "python .agents/skills/archont561", description = "maths via the archont561 skill: math-slide, omml, omml-slide, mathml-omml" }
