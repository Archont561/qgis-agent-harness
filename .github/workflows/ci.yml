name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One job per concern, each installing the smallest environment it can: everything that reads or
# rewrites repo text is `qa`, and the test job must not download QGIS to check four tests. The
# environments are derived from pixi.toml, so this mirrors the split rather than inventing a second one.
jobs:
  scope:
    # One question, answered once: does this range touch anything but prose? The suite measures
    # Python under experiment/ and scripts/, so a docs-only change pays for a job it cannot fail
    # — and pays for it again on every force-push. Linting still runs unconditionally: prose,
    # structure and commit messages are exactly what a docs change has to answer for.
    #
    # The list is an allowlist, never a denylist: a file the case below does not recognise counts
    # as code, and the safest answer to "is this docs?" is "no". Same for an unreadable range —
    # the suite then runs, which is the status quo, not a silent skip.
    name: Scope of the change
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the range below names commits, so the history has to be there

      - name: Fetch the base branch (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Is the change prose only
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            range="$BASE...$HEAD"
          else
            range="$BEFORE...$AFTER"
          fi
          changed=$(git diff --name-only "$range" 2>/dev/null || true)
          # Markdown wherever it stands, the three prose trees, the prose linter's own config
          # and the licence: nothing a Python import can reach.
          files=0
          code=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            files=$((files + 1))
            case "$path" in
              *.md|docs/*|thesis/*|backlog/*|LICENSE|.vale/*|.vale.ini) ;;
              *) code=$((code + 1)) ;;
            esac
          done <<< "$changed"
          # Nothing in the range, or a range that could not be read: not a docs-only change.
          if [ "$files" -gt 0 ] && [ "$code" -eq 0 ]; then
            docs_only=true
          else
            docs_only=false
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          # Twice on purpose: the job page shows the step summary, and a verdict nobody can read
          # from the log is a gate nobody can debug.
          printf '%s\n' "range: \`$range\`" > "$GITHUB_STEP_SUMMARY"
          echo "changed files: $files, outside the docs set: $code, docs-only: $docs_only" |
            tee -a "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint, lint-check, structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # convco needs the full history to compute a range

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: qa

      - name: Lint Python
        run: pixi run lint-py

      - name: Check repository structure
        run: pixi run alint

      - name: Lint GitHub Actions workflows
        run: pixi run lint

      - name: Lint prose
        # Vale over thesis/ and docs/, in the same env as the linters above: vale, ruff and alint are
        # one toolchain. The rules are committed, so no network is needed; .vale.ini decides which
        # markdown counts as prose at all, and only error-level findings fail here.
        run: pixi run prose

  test:
    name: Test, coverage
    needs: scope
    # Skipped, not failed: a docs-only change has nothing for pytest to measure, and a green
    # suite that cannot fail is noise. The lint job above is the gate that does apply to it.
    if: needs.scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: test # pytest + harness, no QGIS

      - name: Test with coverage
        run: pixi run test

      - name: Upload coverage to Codecov
        # Public repo: tokenless upload works. Private repo: add CODECOV_TOKEN.
        run: pixi run cov-upload
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # convco needs the full history to compute a range

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: qa

      # Every commit introduced by this push/PR must be a conventional commit.
      - name: Conventional commits introduced by this push
        # github.event.before is all-zeros on a repo's first push — nothing to range-check.
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: pixi run check-commits ${{ github.event.before }}..HEAD --first-parent

      - name: Fetch base branch for commit linting (PR)
        if: github.event_name == 'pull_request'
        # Plain `git`, not `pixi run git`: the pixi `default` environment is empty on purpose, and
        # the runner's git is the one that has the credentials.
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Conventional commits introduced by this PR
        if: github.event_name == 'pull_request'
        run: pixi run check-commits origin/main..HEAD --first-parent
