# Python version coverage — a different question from the one pixi answers.
#
# pixi solves one interpreter (3.12, pinned in pixi.toml), because QGIS 3.44 is a 3.12 build and a
# measurement must not move underneath it. tox asks whether the *code* still passes on the
# interpreters that come next: no QGIS, no solve, just the suites that are already written to run
# without it — `pixi run test` reports 94 % coverage with no QGIS installed.

[tox]
# No 3.11 and below: experiment/pyproject.toml declares requires-python >=3.12, and
# hypothesis 6.170.15 needs >=3.11 on its own.
envlist = py312, py313, py314
# A missing interpreter fails rather than skips: a version nobody ran is the one that breaks.
skip_missing_interpreters = false

[testenv]
description = the harness suite, the checker suite and the sweep-host suite on this interpreter
# The pixi `test` feature's pins, from PyPI: pytest 8 because pytest-bdd 8.1.0 reads
# FixtureManager._arg2fixturedefs, which pytest 9 removes.
deps =
    pytest>=8,<9
    pytest-bdd==8.1.0
    hypothesis==6.170.15
    pyyaml==6.0.3
    typer>=0.12,<1
# Run from source, the way pixi runs them: experiment/tests/conftest.py loads src/ itself, and the
# checker tests spawn scripts/*.py with sys.executable. Nothing is installed and no wheel is built,
# so a broken build backend is not what these environments are watching for.
commands =
    pytest experiment {posargs}
    pytest scripts/tests .cluster/tests
