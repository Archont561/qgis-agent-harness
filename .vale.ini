# Vale — the prose linter (https://vale.sh). Config key reference: https://vale.sh/docs/vale-ini
# Rule catalogue: https://vale.sh/hub
#
# `pixi run prose` lints the prose tree, `pixi run vale <paths>` lints exactly what you name.
#
# The Microsoft rules in .vale/styles/ are COMMITTED, not fetched on first use. Vale's own advice is
# the opposite — gitignore the synced styles and let `sync` rebuild them — but this repository has to
# lint prose in an airlocked sandbox (scripts/restore.sh restores environments, not the network), and
# a gate that cannot run offline is not a gate. `pixi run prose-sync` re-downloads the package when
# you want to move to a newer rule set; review and commit the diff it leaves.

StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Microsoft

# Vale lints YAML frontmatter as prose: every top-level string becomes its own block, scoped
# `text.frontmatter.<key>`, and that pass honours nothing but IgnoredScopes — BlockIgnores and
# TokenIgnores, the usual workarounds, never reach it. Bare `frontmatter` drops the whole header.
# Our frontmatter is metadata checked by .alint.yml's schema rule, and its `question:` field is a
# question on purpose, so it must not be read as prose. `tt, code, kbd` are Vale's own default for
# inline HTML and have to be repeated, because setting IgnoredScopes replaces that default.
IgnoredScopes = tt, code, kbd, frontmatter

# ───────────────────────────────────────────────────────── markdown ──

[*.md]
BasedOnStyles = Microsoft

# The Microsoft guide is written for product documentation, not for a thesis. Every rule switched
# off below argues with the register these documents are written in — none of them is off because
# the finding was inconvenient to fix. Anything still on is a real invariant (see docs/prose.md).

# ── Register ──
# No contractions, and the method is reported in the passive: "the matrix was generated", not
# "we generate the matrix and it's fast".
Microsoft.Contractions = NO
Microsoft.Passive = NO
# The thesis argues in the first person plural by design. It is one author's claim about work one
# author did; the alternative voice is one nobody in this literature writes in.
Microsoft.We = NO
Microsoft.FirstPerson = NO

# ── Punctuation the house style uses on purpose ──
# Em dashes carry the clause structure here, spaced on both sides. Microsoft closes them up.
Microsoft.Dashes = NO
# Logical (British) punctuation: the comma belongs outside the closing quote.
Microsoft.Quotes = NO
# Semicolons join clauses in one breath, and a §-reference in the middle makes splitting the
# sentence worse, not better. The rule's only suggestion is always "simplify this sentence".
Microsoft.Semicolon = NO
# Every heading that states what a document answers carries the colon ("From runs to claims:"),
# and every document that answers one question ends its heading with a question mark.
Microsoft.HeadingColons = NO
Microsoft.HeadingPunctuation = NO
# e.g. and i.e. are scholarly Latin, not American slang to be spelled out.
Microsoft.Foreign = NO
# Dates are written day-month-year ("7 November 2026", "7 XI 2026" in the registers). The rule
# insists on the US month-first order.
Microsoft.DateFormat = NO
Microsoft.DateOrder = NO

# ── Sentence shape ──
# 30 words is a product-documentation threshold; these sentences are dense by design and the rule
# produced 681 findings that no rewrite would all satisfy. It flags a register, not a fault.
Microsoft.SentenceLength = NO
# Every -ly word is a finding to this rule ("deliberately", "explicitly", "only"). Academic prose
# needs its hedges and its intensifiers; the ones that are padding are a judgement call.
Microsoft.Adverbs = NO
# The documents are question-driven: one question per file, restated in its heading and its
# `question:` frontmatter. The rule counts questions instead of reading them.
Microsoft.QuestionMarks = NO

# ── Vocabulary and domains ──
# Acronyms are the subject matter (MCP, GIS, QGIS, WMS…), not abbreviations to be spelled out at
# each use. They are defined once in thesis/glossary-of-terms.md, which is the register that has to
# be right — a per-use check here only counts how often the thesis says "MCP".
Microsoft.Acronyms = NO
Microsoft.HeadingAcronyms = NO
# "all uppercase for emphasis" is not what an acronym pair is. All 44 findings were names of things
# ("OGC API", "GRASS GIS", "QGIS MCP") — the rule cannot see the difference between shouting and
# naming, and this thesis names things constantly.
Microsoft.Uppercase = NO
# Microsoft's A–Z word list is product vocabulary: it prefers "personal digital assistant" over
# "agent", which is the wrong suggestion for a thesis about LLM agents. House terms are the
# glossary's job, not a word list borrowed from another genre.
Microsoft.Vocab = NO
Microsoft.Terms = NO
# "family-C", "locally-valid": the rule reads compound labels as hyphenable word pairs. Every
# finding here was a false positive.
Microsoft.Hyphens = NO
# "disabled" in this thesis names a control state, not a person. The rule cannot tell the
# difference, and the sentence it flags is about a QGIS widget.
Microsoft.Accessibility = NO
# Sentence-style capitalization is already the convention; the rule reads a proper noun, an acronym
# or a numbering prefix ("2.1 PTI — …", "Family A — analysis (13)") as title case.
Microsoft.Headings = NO
# The repo's own compound names are hyphenated on purpose — auto-commit, auto-open, auto-retry are
# what the harness calls those steps, not a spelling of "auto commit". The rule is error-level, so
# leaving it on would fail a build over a word that is correct here.
Microsoft.Auto = NO
# "Blast radius" is how far a wrong answer propagates through the pipeline — a sharper noun than
# the rule's suggested "impact", which in academic prose is the vaguer word.
Microsoft.Militaristic = NO

# ── Severity, not silence ──
# The rule's word list bans "backend" and "and so on". "Backend" is the term of art for the layer
# this repo has one of; keep the rule visible without letting it fail a build over that word.
Microsoft.Avoid = warning

# ────────────────────────────────────────────── not ours to lint ──
# Vale still walks these when a whole directory is passed, so every exclusion is declared here
# rather than left to whoever remembers to pass the right paths. An empty `BasedOnStyles` means
# "matches no style": the file is skipped, not merely quietened.

# Machine-extracted paper transcripts and raw API dumps — derived, not written (also ignored by
# .alint.yml, and by the same reasoning).
[thesis/literature/**]
BasedOnStyles =

# Faithful conversions of the competition rulebooks: quoted legislation, § numbering intact.
[thesis/competitions/marpit-geoinformation-award-2020.md]
BasedOnStyles =

[thesis/competitions/pti-kpm-rules.md]
BasedOnStyles =

[thesis/competitions/sgp-kd-rules-2023.md]
BasedOnStyles =

# The two Polish registers (frontmatter `language: pl`). English rules on Polish text produce noise
# only, and Vale cannot read the frontmatter to find that out.
[thesis/concept-dictionary.md]
BasedOnStyles =

[thesis/glossary-of-terms.md]
BasedOnStyles =

# Managed by the Backlog.md CLI; vendored skills are pinned by skills-lock.json; build output.
[backlog/**]
BasedOnStyles =

[.agents/skills/**]
BasedOnStyles =

[node_modules/**]
BasedOnStyles =

[experiment/build/**]
BasedOnStyles =
