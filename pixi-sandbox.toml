schema = 1
branch_prefix = "sandbox"
cargo_vendor = false

[budgets]
max_blob_mib = 95
max_transport_mib = 2048
max_repository_push_mib = 2048
max_restore_required_mib = 8192

# Every environment pixi declares, in the order pixi.toml declares them: a restored sandbox then lints,
# tests, measures, runs the backlog and renders without a second install. The empty `default` is listed
# because it is an environment; it carries no blob.
[[bundle]]
name = "developer"
environments = ["default", "experiment", "test", "qa", "js", "renderers"]
platforms = ["linux-64"]
